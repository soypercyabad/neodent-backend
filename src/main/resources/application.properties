# =============================================
# APPLICATION
# =============================================
spring.application.name=neodent-backend


# =============================================
# DATABASE
# =============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true


# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration


# =============================================
# SERVER & PROXY
# =============================================
server.port=${PORT}
server.forward-headers-strategy=framework


# =============================================
# HIKARICP POOL TUNING
# =============================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=5000


# =============================================
# REFRESH TOKEN COOKIE
# =============================================
auth.refresh.cookie-name=neodent_refresh
auth.refresh.cookie-secure=${REFRESH_COOKIE_SECURE}
auth.refresh.cookie-same-site=${REFRESH_COOKIE_SAME_SITE}


# =============================================
# TIMEZONE / JACKSON
# =============================================
spring.jackson.time-zone=America/Lima
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss


# =============================================
# OPENAPI / SWAGGER
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# =============================================
# DNI API
# =============================================
dni.api.base-url=${DNI_API_BASE_URL:https://api.apis.net.pe}
dni.api.token=${DNI_API_TOKEN}



# =============================================
# BREVO EMAIL
# =============================================
brevo.api.url=https://api.brevo.com
brevo.api.key=${BREVO_API_KEY}

brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=NeoDent


# =============================================
# JWT
# =============================================
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=15
jwt.refresh-expiration-days=7


# =============================================
# Turnstile
# =============================================
turnstile.secret=${TURNSTILE_SECRET}
turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify


# =============================================
# Frontend URL
# =============================================
app.frontend-url=${FRONTEND_URL}


