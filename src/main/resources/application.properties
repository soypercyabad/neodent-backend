# =============================================
# APPLICATION
# =============================================
spring.application.name=neodent-backend


# =============================================
# DATABASE
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/neodent_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration


# =============================================
# SERVER
# =============================================
server.port=${PORT:8080}


# =============================================
# OPENAPI / SWAGGER
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# =============================================
# DNI API
# =============================================
dni.api.base-url=${DNI_API_BASE_URL:https://api.apis.net.pe}
dni.api.token=${DNI_API_TOKEN:}
